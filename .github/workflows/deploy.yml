name: Deploy site

# Rebuilds and deploys the site to Cloudflare Pages when:
#  - code is pushed to main
#  - NovaPortal publishes content (repository_dispatch from the portal Worker)
#  - triggered manually from the Actions tab
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [novaportal-publish]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (content pulled from NovaPortal)
        run: npx astro build
        env:
          NOVAPORTAL_READ_TOKEN: ${{ secrets.NOVAPORTAL_READ_TOKEN }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=greennestco --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
